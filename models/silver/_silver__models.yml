version: 2

models:
  - name: vehicle_lifecycle
    description: >
      Capa silver — vista 360º por vehículo: producción, distribución y venta.
      Un vehículo que todavía no se ha distribuido o vendido aparece con esas
      columnas en NULL (LEFT JOIN intencional).
    columns:
      - name: vin
        tests: [not_null, unique]
      - name: vehicle_type
        tests: [not_null]
      - name: model
        tests: [not_null]
      - name: base_price
        description: Precio base del modelo (materials.base_price).
      - name: manufactured_at_factory
        tests: [not_null]
      - name: assembly_line
        tests: [not_null]
      - name: production_date
        tests: [not_null]
      - name: dispatch_date
        description: Fecha de salida de fábrica hacia el concesionario. NULL si aún no se ha distribuido.
      - name: arrival_date
        description: Fecha de llegada al concesionario. NULL si aún no se ha distribuido.
      - name: distributed_to_dealer
        description: >
          Concesionario que recibió el vehículo. NULL si aún no se ha distribuido —
          usar esta columna (no arrival_date) para filtrar "ya distribuido", porque
          viene de un dealer_id con test not_null en bronze.
      - name: sale_date
        description: Fecha de venta. NULL si todavía no se ha vendido.
      - name: sold_by_dealer
        description: >
          Concesionario que vendió el vehículo. NULL si todavía no se ha vendido —
          usar esta columna (no sale_date) para filtrar "ya vendido", porque viene
          de un dealer_id con test not_null en bronze.
      - name: sold_by_dealer_city
        description: Ciudad del concesionario que vendió el vehículo. NULL si todavía no se ha vendido.
      - name: current_km
        description: Kilometraje actual reportado por telemetría. NULL si todavía no se ha vendido.
      - name: km_to_next_service
        description: Km restantes hasta el próximo mantenimiento programado. NULL si todavía no se ha vendido.
      - name: estimated_km_to_breakdown
        description: Km estimados hasta una avería. NULL si todavía no se ha vendido.
