version: 2

sources:
  - name: factory_ops
    description: Capa bronze — tablas operativas de fábrica tal cual llegan a Supabase.
    schema: factory_ops
    tables:
      - name: vehicles
        columns:
          - name: vin
            tests: [not_null, unique]
          - name: mat_cod
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('factory_ops', 'materials')
                    field: mat_cod
          - name: factory_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('factory_ops', 'factories')
                    field: factory_id
          - name: line_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('factory_ops', 'assembly_lines')
                    field: line_id
          - name: production_date
            tests: [not_null]

      - name: factories
        columns:
          - name: factory_id
            tests: [not_null, unique]
          - name: name
            tests: [not_null]

      - name: assembly_lines
        columns:
          - name: line_id
            tests: [not_null, unique]
          - name: factory_id
            tests: [not_null]
          - name: line_name
            tests: [not_null]

      - name: materials
        columns:
          - name: mat_cod
            tests: [not_null, unique]
          - name: name
            tests: [not_null]

      - name: dealerships
        columns:
          - name: dealer_id
            tests: [not_null, unique]
          - name: name
            tests: [not_null]
          - name: city
            tests: [not_null]

      - name: distribution
        columns:
          - name: vin
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('factory_ops', 'vehicles')
                    field: vin
          - name: dealer_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('factory_ops', 'dealerships')
                    field: dealer_id

      - name: sales_and_telemetry
        columns:
          - name: vin
            tests:
              - not_null
              - unique
              - relationships:
                  arguments:
                    to: source('factory_ops', 'vehicles')
                    field: vin
          - name: sold_by_dealer_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('factory_ops', 'dealerships')
                    field: dealer_id
